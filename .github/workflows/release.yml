name: release

on:
  workflow_dispatch:

# Minimum token permissions (security guideline Rule 2): read at the
# workflow level; only the publish job escalates to contents: write.
permissions:
  contents: read

# Serialize manual dispatches so two runs can never race the same release.
# cancel-in-progress stays false: a release in flight must complete.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend_tag: ${{ steps.resolve.outputs.frontend_tag }}
      frontend_version: ${{ steps.resolve.outputs.frontend_version }}
      backend_tag: ${{ steps.resolve.outputs.backend_tag }}
      backend_version: ${{ steps.resolve.outputs.backend_version }}
    steps:
      - name: Guard — releases only from main
        if: github.ref_name != 'main'
        # GITHUB_REF_NAME is a runner-provided env var — safe to use in run:
        # (no ${{ github.event.* }} interpolation, guideline Rule 5).
        run: |
          echo "::error::Dispatch this workflow from the 'main' branch (dispatched from '$GITHUB_REF_NAME')."
          exit 1

      - name: Resolve upstream latest releases
        id: resolve
        # Step-level env only — the token is never interpolated into run:
        # (guideline Rule 5).
        env:
          GH_TOKEN: ${{ secrets.SLOPON_CI_CHECKOUT_TOKEN }}
        run: |
          if ! frontend_tag=$(gh release view --repo DigiDecode/slopon_frontend --json tagName --jq '.tagName'); then
            echo "::error::Could not read the latest release of DigiDecode/slopon_frontend — check that SLOPON_CI_CHECKOUT_TOKEN has access to that repo."
            exit 1
          fi
          if ! backend_tag=$(gh release view --repo DigiDecode/slopon_backend --json tagName --jq '.tagName'); then
            echo "::error::Could not read the latest release of DigiDecode/slopon_backend — check that SLOPON_CI_CHECKOUT_TOKEN has access to that repo."
            exit 1
          fi
          echo "frontend_tag=$frontend_tag" >> "$GITHUB_OUTPUT"
          echo "backend_tag=$backend_tag" >> "$GITHUB_OUTPUT"
          echo "frontend_version=${frontend_tag#v}" >> "$GITHUB_OUTPUT"
          echo "backend_version=${backend_tag#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved frontend $frontend_tag, backend $backend_tag"

      - name: Assert expected assets exist
        env:
          GH_TOKEN: ${{ secrets.SLOPON_CI_CHECKOUT_TOKEN }}
          FRONTEND_TAG: ${{ steps.resolve.outputs.frontend_tag }}
          BACKEND_TAG: ${{ steps.resolve.outputs.backend_tag }}
        run: |
          frontend_assets=$(gh release view "$FRONTEND_TAG" --repo DigiDecode/slopon_frontend --json assets --jq '.assets[].name')
          backend_assets=$(gh release view "$BACKEND_TAG" --repo DigiDecode/slopon_backend --json assets --jq '.assets[].name')
          missing=0
          for name in \
            slopon_dev-latest-windows-x64.zip \
            slopon_dev-latest-linux-x64.tar.gz \
            slopon_dev-latest-macos-x64.zip \
            slopon_dev-latest-macos-arm64.zip; do
            if ! grep -qx "$name" <<< "$frontend_assets"; then
              echo "::error::Asset '$name' missing from DigiDecode/slopon_frontend release $FRONTEND_TAG"
              missing=1
            fi
          done
          if ! grep -qx "slopon-backend-latest.zip" <<< "$backend_assets"; then
            echo "::error::Asset 'slopon-backend-latest.zip' missing from DigiDecode/slopon_backend release $BACKEND_TAG"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  package:
    name: package (${{ matrix.platform }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true   # all-or-nothing release: one leg failure skips publish
      matrix:
        include:
          - { platform: windows-x64, os: ubuntu-24.04, frontend_asset: slopon_dev-latest-windows-x64.zip,   ext: zip    }
          - { platform: linux-x64,    os: ubuntu-24.04, frontend_asset: slopon_dev-latest-linux-x64.tar.gz, ext: tar.gz }
          - { platform: macos-x64,    os: macos-15,     frontend_asset: slopon_dev-latest-macos-x64.zip,    ext: zip    }
          - { platform: macos-arm64,  os: macos-15,     frontend_asset: slopon_dev-latest-macos-arm64.zip,  ext: zip    }
    steps:
      - name: Checkout SlopOn.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only needed for docs/release-README.md; nothing later requires the
          # persisted token (gh uses GH_TOKEN).
          persist-credentials: false

      - name: Download upstream release assets
        # Isolated download paths (guideline Rule 7): downloads can never
        # touch the checkout. Binaries are repackaged, never executed.
        env:
          GH_TOKEN: ${{ secrets.SLOPON_CI_CHECKOUT_TOKEN }}
          FRONTEND_TAG: ${{ needs.resolve.outputs.frontend_tag }}
          BACKEND_TAG: ${{ needs.resolve.outputs.backend_tag }}
          FRONTEND_ASSET: ${{ matrix.frontend_asset }}
        run: |
          mkdir -p downloads/frontend downloads/backend
          gh release download "$FRONTEND_TAG" --repo DigiDecode/slopon_frontend \
            --pattern "$FRONTEND_ASSET" --dir downloads/frontend --clobber
          gh release download "$BACKEND_TAG" --repo DigiDecode/slopon_backend \
            --pattern "slopon-backend-latest.zip" --dir downloads/backend --clobber

      - name: Assemble combined folder
        env:
          PLATFORM: ${{ matrix.platform }}
          FRONTEND_ASSET: ${{ matrix.frontend_asset }}
        run: |
          name="slopon-$PLATFORM"
          stage="stage/$name"
          mkdir -p "$stage/frontend"
          # Frontend payload: upstream archives have no wrapping folder, so
          # everything extracts directly under frontend/.
          case "$FRONTEND_ASSET" in
            *.tar.gz)
              tar -xzf "downloads/frontend/$FRONTEND_ASSET" -C "$stage/frontend"
              ;;
            *.zip)
              if [ "$RUNNER_OS" = "macOS" ]; then
                # ditto (not unzip) preserves framework symlinks.
                ditto -x -k "downloads/frontend/$FRONTEND_ASSET" "$stage/frontend"
              else
                unzip -q "downloads/frontend/$FRONTEND_ASSET" -d "$stage/frontend"
              fi
              ;;
          esac
          # Backend payload: its zip already wraps everything in a top-level
          # backend/ folder, so it lands exactly right when extracted here.
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -x -k "downloads/backend/slopon-backend-latest.zip" "$stage"
          else
            unzip -q "downloads/backend/slopon-backend-latest.zip" -d "$stage"
          fi
          # Launcher payload: the shared launcher core + both wrappers ship in
          # every archive (per-leg filtering would diverge for zero gain).
          cp -r launcher "$stage/launcher"
          cp docs/release-README.md "$stage/README.md"

      - name: Package combined archive
        env:
          PLATFORM: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
        run: |
          name="slopon-$PLATFORM"
          mkdir -p out
          case "$EXT" in
            tar.gz)
              # tar preserves exec bits and symlinks; single top-level dir.
              tar -czf "out/$name.tar.gz" -C stage "$name"
              ;;
            zip)
              if [ "$RUNNER_OS" = "macOS" ]; then
                # ditto (not zip) preserves framework symlinks inside the .app.
                ditto -c -k --keepParent "stage/$name" "out/$name.zip"
              else
                # -y stores any symlinks as symlinks; exec bits are recorded.
                (cd stage && zip -q -r -y "../out/$name.zip" "$name")
              fi
              ;;
          esac

      - name: Verify shipped archive
        env:
          PLATFORM: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
        run: |
          name="slopon-$PLATFORM"
          archive="out/$name.$EXT"
          mkdir -p verify-tmp
          # Re-extract the shipped archive with the same tool family that
          # packaged it, then assert against that extraction — not the staging dir.
          case "$EXT" in
            tar.gz)
              tar -xzf "$archive" -C verify-tmp
              ;;
            zip)
              if [ "$RUNNER_OS" = "macOS" ]; then
                ditto -x -k "$archive" verify-tmp
              else
                unzip -q "$archive" -d verify-tmp
              fi
              ;;
          esac
          root="verify-tmp/$name"
          require() {
            if [ ! "$1" "$2" ]; then
              echo "::error::Shipped archive check failed: expected $1 '$2'"
              exit 1
            fi
          }
          require -f "$root/README.md"
          require -f "$root/backend/index.js"
          require -f "$root/backend/package.json"
          require -f "$root/backend/package-lock.json"
          require -f "$root/launcher/launcher.mjs"
          require -f "$root/launcher/slopon.sh"
          require -f "$root/launcher/slopon.cmd"
          case "$PLATFORM" in
            windows-x64)
              require -f "$root/frontend/slopon_dev.exe"
              require -f "$root/frontend/flutter_windows.dll"
              ;;
            linux-x64)
              # exec bit must survive the archive round-trip (tar preserves it).
              require -x "$root/frontend/slopon_dev"
              require -f "$root/frontend/lib/libapp.so"
              ;;
            macos-x64|macos-arm64)
              require -f "$root/frontend/slopon_dev.app/Contents/Info.plist"
              # framework symlink must survive — the macOS corruption guard.
              require -L "$root/frontend/slopon_dev.app/Contents/Frameworks/FlutterMacOS.framework/FlutterMacOS"
              ;;
            *)
              echo "::error::Unknown platform '$PLATFORM'"
              exit 1
              ;;
          esac
          echo "Shipped archive verified: $name.$EXT"

      - name: Upload combined archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: combined-${{ matrix.platform }}
          path: out/slopon-${{ matrix.platform }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7   # intermediate only; the release is the deliverable

  publish:
    name: publish
    # resolve is a direct dependency (not just transitive via package)
    # because the release notes quote its version outputs — the
    # needs.<job>.outputs context only covers direct needs.
    needs: [resolve, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # create/update releases + tags (Rule 2: job-scoped)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          # Isolated path (Rule 7). Without a name: input all four artifacts
          # land under dist/combined-<platform>/.
          path: dist

      - name: Write checksums and release notes
        env:
          FRONTEND_VERSION: ${{ needs.resolve.outputs.frontend_version }}
          BACKEND_VERSION: ${{ needs.resolve.outputs.backend_version }}
        run: |
          {
            echo "## SlopOn v$BACKEND_VERSION"
            echo
            echo "Combined customer bundle: slopon_dev frontend + slopon-backend."
            echo
            echo "- Frontend version: $FRONTEND_VERSION"
            echo "- Backend version: $BACKEND_VERSION"
            echo
            # The markers delimit this table for the vt-scan job, which
            # rewrites the block as a 4-column table after scanning.
            echo "<!-- vt-table:start -->"
            echo "| Platform | Asset | SHA-256 |"
            echo "|---|---|---|"
            for platform in windows-x64 linux-x64 macos-x64 macos-arm64; do
              # Keep this platform→ext mapping in sync with the package matrix.
              case "$platform" in
                linux-x64) ext=tar.gz ;;
                *) ext=zip ;;
              esac
              file="dist/combined-$platform/slopon-$platform.$ext"
              sha=$(sha256sum "$file" | awk '{print $1}')
              echo "| $platform | slopon-$platform.$ext | \`$sha\` |"
            done
            echo "<!-- vt-table:end -->"
            echo
            echo "Each archive contains \`README.md\`, \`frontend/\`, \`backend/\` and \`launcher/\`. The backend requires Node.js ≥ 20, or use the one-liner installer: https://slopon.dev/install.sh (macOS/Linux) / https://slopon.dev/install.ps1 (Windows)."
            echo
            echo "Artifacts are **unsigned**: expect a Gatekeeper warning (macOS) or SmartScreen warning (Windows) on first launch."
          } > notes.md
          cat notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh cannot discover the repo from a
          # git remote — point it at SlopOn.dev explicitly.
          GH_REPO: DigiDecode/SlopOn.dev
          BACKEND_VERSION: ${{ needs.resolve.outputs.backend_version }}
        run: |
          # The release tag is the backend version. GitHub's separate "Latest
          # release" marker is what .../releases/latest/download/... resolves to;
          # it is (re-)asserted on BOTH the create and the update path.
          tag="v$BACKEND_VERSION"
          # Keep this find pattern in sync with the package matrix asset names.
          mapfile -t files < <(find dist \( -name 'slopon-*.tar.gz' -o -name 'slopon-*.zip' \) | sort)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::Expected exactly 4 archives to publish, found ${#files[@]}: ${files[*]:-none}"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists — overwriting assets and notes in place, re-asserting Latest"
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --latest --notes-file notes.md
          else
            echo "Creating release $tag"
            gh release create "$tag" "${files[@]}" \
              --title "SlopOn $tag" \
              --notes-file notes.md \
              --latest
          fi

  verify-installers:
    name: verify-installers
    # Post-publish tripwire: a failure never unpublishes the release — the red
    # run IS the signal. Live mode: the real slopon.dev one-liners against the
    # just-published release (deploy verified 2026-08-27, live run 33101959508
    # green on all 6 legs). Staged mode remains available via direct dispatch
    # of installer-verify.yml for pre-website testing.
    needs: publish
    uses: ./.github/workflows/installer-verify.yml
    with:
      mode: 'live'
    secrets: inherit

  vt-scan:
    name: vt-scan
    # Fail-soft: VT verdicts are appended after the release is live, so a
    # VirusTotal problem (quota, timeout, outage) must never turn the run
    # red — warnings and empty cells only. Runs in parallel with
    # verify-installers, which never touches the release body.
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # backstop: 4 files × (upload + ≤600 s polling) fits
    permissions:
      contents: write   # rewrite the release body (Rule 2: job-scoped)
    steps:
      - name: Checkout SlopOn.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only .github/scripts/vt_scan.py is needed; nothing later requires
          # the persisted token (gh uses GH_TOKEN).
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          # Isolated path (Rule 7); all four artifacts land under
          # dist/combined-<platform>/ — same layout as the publish job.
          path: dist

      - name: Set up Python
        # Toolcache Python, not system pip: Ubuntu 24.04 marks the system
        # interpreter as externally managed (PEP 668).
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install vt-py
        run: python3 -m pip install --disable-pip-version-check vt-py==0.22.0

      - name: Scan artifacts with VirusTotal
        # The key enters only via step-level env (Rule 5) — never
        # interpolated into run:.
        env:
          TOTALVIRUS_API_KEY: ${{ secrets.TOTALVIRUS_API_KEY }}
        run: |
          python3 -m py_compile .github/scripts/vt_scan.py
          files=()
          for platform in windows-x64 linux-x64 macos-x64 macos-arm64; do
            # Keep this platform→ext mapping in sync with the package matrix.
            case "$platform" in
              linux-x64) ext=tar.gz ;;
              *) ext=zip ;;
            esac
            files+=("dist/combined-$platform/slopon-$platform.$ext")
          done
          python3 .github/scripts/vt_scan.py "${files[@]}" | tee vt-results.tsv

      - name: Add VirusTotal column to the release table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit on purpose: same convention as the publish job.
          GH_REPO: DigiDecode/SlopOn.dev
          BACKEND_VERSION: ${{ needs.resolve.outputs.backend_version }}
        run: |
          tag="v$BACKEND_VERSION"
          # Fail-soft guards: with no usable results or an unreadable body,
          # warn and leave the notes exactly as publish wrote them.
          if [ ! -s vt-results.tsv ]; then
            echo "::warning::No VirusTotal results — release body left unchanged"
            exit 0
          fi
          if ! awk -F'\t' 'NF >= 2 && $2 != "" { found = 1 } END { exit !found }' vt-results.tsv; then
            echo "::warning::Every VirusTotal scan failed — release body left unchanged"
            exit 0
          fi
          if ! gh release view "$tag" --json body --jq .body > body.md; then
            echo "::warning::Could not read the release body — left unchanged"
            exit 0
          fi
          if ! grep -qx '<!-- vt-table:start -->' body.md \
             || ! grep -qx '<!-- vt-table:end -->' body.md; then
            echo "::warning::Release body has no vt-table markers — left unchanged"
            exit 0
          fi
          # Pre-flight: every artifact must be present to build the table;
          # a warning inside the redirected group below would be swallowed.
          for platform in windows-x64 linux-x64 macos-x64 macos-arm64; do
            case "$platform" in
              linux-x64) ext=tar.gz ;;
              *) ext=zip ;;
            esac
            if [ ! -f "dist/combined-$platform/slopon-$platform.$ext" ]; then
              echo "::warning::Artifact 'dist/combined-$platform/slopon-$platform.$ext' missing — release body left unchanged"
              exit 0
            fi
          done
          # Rebuild the marked block as a 4-column table; a failed scan keeps
          # an empty VirusTotal cell on its row.
          {
            echo "| Platform | Asset | SHA-256 | VirusTotal |"
            echo "|---|---|---|---|"
            for platform in windows-x64 linux-x64 macos-x64 macos-arm64; do
              case "$platform" in
                linux-x64) ext=tar.gz ;;
                *) ext=zip ;;
              esac
              file="dist/combined-$platform/slopon-$platform.$ext"
              sha=$(sha256sum "$file" | awk '{print $1}')
              cell=$(awk -F'\t' -v want="$sha" '$1 == want && $2 != "" { print $2; exit }' vt-results.tsv)
              echo "| $platform | slopon-$platform.$ext | \`$sha\` | $cell |"
            done
          } > vt-block.md
          # Splice the new block between the markers. The markers stay in the
          # body, so re-dispatching overwrites the column in place — no
          # duplicated tables or rows.
          awk -v block=vt-block.md '
            /^<!-- vt-table:start -->$/ { print; while ((getline line < block) > 0) print line; close(block); skip = 1; next }
            /^<!-- vt-table:end -->$/ { skip = 0; print; next }
            !skip { print }
          ' body.md > body-new.md
          # Guarded edit: bash -e would otherwise redden the job on a transient
          # gh/API failure — the body stays valid either way.
          if ! gh release edit "$tag" --notes-file body-new.md; then
            echo "::warning::Could not update the release body — left unchanged"
          fi
